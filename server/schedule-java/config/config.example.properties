# 复制到 %USERPROFILE%\.huhuashizhe-schedule\config.properties
# 或复制到本项目 config/config.properties，再填入真实值。
# 不要把真实密钥提交到 Git。

schedule.key=请设置团队排班密钥
admin.key=请设置管理员密钥
token.secret=请设置至少32位的随机字符串

# 成员验证与在线状态由服务端自动记录：成员用团队密钥登录并通过姓名验证后即视为已验证。

# 可选；留空时默认写到用户目录下 .huhuashizhe-schedule
# db.path=C:/Users/yourname/.huhuashizhe-schedule/schedule.db
# backup.dir=C:/Users/yourname/.huhuashizhe-schedule/backups

# 可选；默认 365 天 / 90 天
# member.token.ttl.seconds=31536000
# admin.token.ttl.seconds=7776000

# AI 代理（App 不再内置大模型 Key，统一由服务器转发）
# Key 只写在这里，不要提交到 Git；留空时 App 的 AI 功能返回“AI 服务尚未配置”
# ai.api.key=sk-xxxx
# ai.base.url=https://maas.qianwenaiapi.com/compatible-mode/v1
# ai.model=qwen3.8-flash
